<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskBoard ADM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0F172A;
    --surface: #1E293B;
    --surface2: #263147;
    --border: #334155;
    --text: #F1F5F9;
    --text-muted: #94A3B8;
    --accent: #6366F1;
    --accent-hover: #818CF8;
    --green: #22C55E;
    --orange: #F59E0B;
    --red: #EF4444;
    --blue: #38BDF8;
    --purple: #A78BFA;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.5px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .badge-adm {
    background: linear-gradient(135deg, var(--accent), var(--purple));
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .btn-add-col {
    background: var(--accent);
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: background 0.2s, transform 0.1s;
    font-family: inherit;
  }
  .btn-add-col:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-add-col:active { transform: translateY(0); }

  .sync-indicator {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  .sync-dot.syncing { background: var(--orange); animation: spin-dot 0.8s linear infinite; }
  .sync-dot.error { background: var(--red); animation: none; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes spin-dot { 0%{transform:scale(1)} 50%{transform:scale(1.5)} 100%{transform:scale(1)} }

  /* BOARD */
  .board-wrapper {
    padding: 28px;
    overflow-x: auto;
    min-height: calc(100vh - 60px);
  }

  .board {
    display: flex;
    gap: 18px;
    align-items: flex-start;
    min-height: calc(100vh - 116px);
    padding-bottom: 28px;
  }

  /* COLUMN */
  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 300px;
    min-width: 300px;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 116px);
    transition: box-shadow 0.2s;
  }

  .column.drag-over {
    box-shadow: 0 0 0 2px var(--accent);
    background: var(--surface2);
  }

  .col-header {
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .col-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  .col-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .col-title {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .col-title:hover { background: var(--surface2); }

  .col-title-input {
    font-weight: 600;
    font-size: 14px;
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--text);
    border-radius: 4px;
    padding: 2px 6px;
    outline: none;
    font-family: inherit;
    width: 140px;
  }

  .col-count {
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .col-actions {
    display: flex;
    gap: 4px;
  }

  .col-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
  }
  .col-btn:hover { color: var(--text); background: var(--surface2); }
  .col-btn.danger:hover { color: var(--red); }

  .col-cards {
    padding: 10px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 60px;
  }

  .col-cards::-webkit-scrollbar { width: 4px; }
  .col-cards::-webkit-scrollbar-track { background: transparent; }
  .col-cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .col-footer {
    padding: 10px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .btn-add-card {
    width: 100%;
    background: none;
    border: 1px dashed var(--border);
    color: var(--text-muted);
    padding: 8px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-add-card:hover { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,0.06); }

  /* CARD */
  .card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    cursor: grab;
    position: relative;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    user-select: none;
    border-left: 3px solid transparent;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
    border-color: var(--border);
  }

  .card.dragging {
    opacity: 0.4;
    transform: scale(0.97);
    cursor: grabbing;
  }

  .card.priority-high { border-left-color: var(--red); }
  .card.priority-medium { border-left-color: var(--orange); }
  .card.priority-low { border-left-color: var(--green); }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 8px;
    color: var(--text);
  }

  .card-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    color: white;
  }

  .priority-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }
  .priority-badge.high { background: rgba(239,68,68,0.2); color: var(--red); }
  .priority-badge.medium { background: rgba(245,158,11,0.2); color: var(--orange); }
  .priority-badge.low { background: rgba(34,197,94,0.2); color: var(--green); }

  .card-due {
    font-size: 11px;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 3px;
  }
  .card-due.overdue { color: var(--red); }

  .card-actions {
    position: absolute;
    top: 8px; right: 8px;
    display: none;
    gap: 4px;
  }
  .card:hover .card-actions { display: flex; }

  .card-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 4px;
    font-size: 12px;
    line-height: 1;
    transition: all 0.15s;
  }
  .card-btn:hover { color: var(--text); border-color: var(--accent); }
  .card-btn.danger:hover { color: var(--red); border-color: var(--red); }

  .drag-placeholder {
    background: rgba(99,102,241,0.1);
    border: 2px dashed var(--accent);
    border-radius: var(--radius-sm);
    height: 60px;
    flex-shrink: 0;
  }

  /* MODAL */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .overlay.active { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 460px;
    max-width: calc(100vw - 40px);
    box-shadow: var(--shadow);
    transform: translateY(16px);
    transition: transform 0.2s;
  }
  .overlay.active .modal { transform: translateY(0); }

  .modal-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input[type="text"], input[type="date"], textarea, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus, select:focus {
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: var(--surface); }

  .color-picker-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-swatch:hover, .color-swatch.active { transform: scale(1.2); border-color: white; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
    justify-content: flex-end;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: none;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 9px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--text-muted); }

  /* EMPTY STATE */
  .empty-board {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    padding: 60px 20px;
    text-align: center;
    gap: 12px;
  }
  .empty-board .big-icon { font-size: 48px; opacity: 0.4; }
  .empty-board p { font-size: 15px; }
  .empty-board small { font-size: 13px; opacity: 0.7; }

  /* TOAST */
  .toast-container {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slide-in 0.3s ease;
    max-width: 280px;
  }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.error { border-left: 3px solid var(--red); }

  @keyframes slide-in { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slide-out { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
  .toast.removing { animation: slide-out 0.3s ease forwards; }

  /* LOADING */
  .loading-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 400;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span style="color:var(--text-muted);font-size:14px">Carregando seu board...</span>
</div>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-icon">📋</div>
    TaskBoard
    <span class="badge-adm">ADM</span>
  </div>
  <div class="header-right">
    <div class="sync-indicator">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncText">Sincronizado</span>
    </div>
    <button class="btn-add-col" onclick="openColumnModal()">
      <span>＋</span> Nova Coluna
    </button>
  </div>
</header>

<!-- Board -->
<div class="board-wrapper">
  <div class="board" id="board">
    <div class="empty-board" id="emptyState" style="display:none">
      <div class="big-icon">🗂️</div>
      <p>Nenhuma coluna ainda</p>
      <small>Clique em "Nova Coluna" para começar</small>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Modal: Card -->
<div class="overlay" id="cardOverlay" onclick="closeCardModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title"><span id="cardModalIcon">📝</span> <span id="cardModalTitle">Nova Tarefa</span></div>

    <div class="form-group">
      <label>Título *</label>
      <input type="text" id="cardTitle" placeholder="Nome da tarefa...">
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea id="cardDesc" placeholder="Detalhes, contexto, links..."></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label>Prioridade</label>
        <select id="cardPriority">
          <option value="none">Nenhuma</option>
          <option value="low">Baixa</option>
          <option value="medium">Média</option>
          <option value="high">Alta</option>
        </select>
      </div>
      <div class="form-group">
        <label>Data limite</label>
        <input type="date" id="cardDue">
      </div>
    </div>
    <div class="form-group">
      <label>Etiqueta</label>
      <input type="text" id="cardTag" placeholder="ex: Frontend, Bug, Design...">
    </div>
    <div class="form-group">
      <label>Cor da etiqueta</label>
      <div class="color-picker-row" id="tagColorPicker"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeCardModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveCard()">Salvar Tarefa</button>
    </div>
  </div>
</div>

<!-- Modal: Column -->
<div class="overlay" id="colOverlay" onclick="closeColumnModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">📂 Nova Coluna</div>
    <div class="form-group">
      <label>Nome da Coluna *</label>
      <input type="text" id="colName" placeholder="ex: A Fazer, Em Andamento, Concluído...">
    </div>
    <div class="form-group">
      <label>Cor indicadora</label>
      <div class="color-picker-row" id="colColorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeColumnModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveColumn()">Criar Coluna</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let state = { columns: [], cards: [] };
let editingCard = null;
let editingCardColumn = null;
let selectedTagColor = '#6366F1';
let selectedColColor = '#6366F1';
let dragCard = null, dragCol = null;
let placeholder = null;
let saveTimeout = null;

const TAG_COLORS = ['#6366F1','#A78BFA','#38BDF8','#22C55E','#F59E0B','#EF4444','#EC4899','#14B8A6','#F97316','#64748B'];
const COL_COLORS = ['#6366F1','#A78BFA','#38BDF8','#22C55E','#F59E0B','#EF4444','#EC4899','#14B8A6','#F97316','#94A3B8'];

// ─── STORAGE (Claude Cloud) ───────────────────────────────────────────────────
async function loadState() {
  try {
    const result = await window.storage.get('taskboard_state');
    if (result && result.value) {
      state = JSON.parse(result.value);
    }
  } catch(e) {
    // First use or key doesn't exist
  }
}

async function persistState() {
  setSyncStatus('syncing');
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      await window.storage.set('taskboard_state', JSON.stringify(state));
      setSyncStatus('ok');
    } catch(e) {
      setSyncStatus('error');
      showToast('Erro ao salvar. Tente novamente.', 'error');
    }
  }, 600);
}

function setSyncStatus(status) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot';
  if (status === 'syncing') { dot.classList.add('syncing'); txt.textContent = 'Salvando...'; }
  else if (status === 'error') { dot.classList.add('error'); txt.textContent = 'Erro ao salvar'; }
  else { txt.textContent = 'Sincronizado'; }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  await loadState();
  buildColorPicker('tagColorPicker', TAG_COLORS, (c) => { selectedTagColor = c; }, '#6366F1');
  buildColorPicker('colColorPicker', COL_COLORS, (c) => { selectedColColor = c; }, '#6366F1');
  renderBoard();
  document.getElementById('loadingOverlay').style.display = 'none';
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById('board');
  const empty = document.getElementById('emptyState');
  board.innerHTML = '';
  board.appendChild(empty);

  if (state.columns.length === 0) {
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  state.columns.forEach(col => {
    const colEl = buildColumnEl(col);
    board.appendChild(colEl);
  });
}

function buildColumnEl(col) {
  const colCards = state.cards.filter(c => c.colId === col.id);
  const el = document.createElement('div');
  el.className = 'column';
  el.dataset.colId = col.id;

  el.innerHTML = `
    <div class="col-header">
      <div class="col-title-wrap">
        <div class="col-dot" style="background:${col.color}"></div>
        <span class="col-title" title="Clique para renomear" ondblclick="startRenameCol('${col.id}', this)">${escHtml(col.name)}</span>
        <span class="col-count">${colCards.length}</span>
      </div>
      <div class="col-actions">
        <button class="col-btn danger" onclick="deleteColumn('${col.id}')" title="Excluir coluna">🗑</button>
      </div>
    </div>
    <div class="col-cards" id="cards-${col.id}" 
      ondragover="onCardDragOver(event,'${col.id}')" 
      ondragleave="onCardDragLeave(event,'${col.id}')" 
      ondrop="onCardDrop(event,'${col.id}')">
    </div>
    <div class="col-footer">
      <button class="btn-add-card" onclick="openCardModal('${col.id}')">＋ Adicionar tarefa</button>
    </div>
  `;

  const cardsContainer = el.querySelector('.col-cards');
  colCards.forEach(card => {
    cardsContainer.appendChild(buildCardEl(card));
  });

  return el;
}

function buildCardEl(card) {
  const el = document.createElement('div');
  el.className = `card${card.priority !== 'none' ? ' priority-' + card.priority : ''}`;
  el.dataset.cardId = card.id;
  el.draggable = true;

  const due = card.due ? formatDue(card.due) : null;
  const overdue = card.due && new Date(card.due) < new Date(todayStr());

  el.innerHTML = `
    <div class="card-actions">
      <button class="card-btn" onclick="openEditCard('${card.id}')" title="Editar">✏️</button>
      <button class="card-btn danger" onclick="deleteCard('${card.id}')" title="Excluir">🗑</button>
    </div>
    <div class="card-title">${escHtml(card.title)}</div>
    <div class="card-meta">
      ${card.tag ? `<span class="tag" style="background:${card.tagColor || '#6366F1'}">${escHtml(card.tag)}</span>` : ''}
      ${card.priority !== 'none' ? `<span class="priority-badge ${card.priority}">${priorityLabel(card.priority)}</span>` : ''}
      ${due ? `<span class="card-due${overdue?' overdue':''}">📅 ${due}</span>` : ''}
    </div>
    ${card.desc ? `<div style="font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5">${escHtml(card.desc).substring(0,80)}${card.desc.length>80?'…':''}</div>` : ''}
  `;

  el.addEventListener('dragstart', (e) => onCardDragStart(e, card.id));
  el.addEventListener('dragend', onCardDragEnd);

  return el;
}

// ─── COLUMNS ─────────────────────────────────────────────────────────────────
function openColumnModal() {
  document.getElementById('colName').value = '';
  selectedColColor = '#6366F1';
  refreshColorPicker('colColorPicker', COL_COLORS, (c) => { selectedColColor = c; }, '#6366F1');
  document.getElementById('colOverlay').classList.add('active');
  setTimeout(() => document.getElementById('colName').focus(), 100);
}

function closeColumnModal(e) {
  if (!e || e.target === document.getElementById('colOverlay')) {
    document.getElementById('colOverlay').classList.remove('active');
  }
}

function saveColumn() {
  const name = document.getElementById('colName').value.trim();
  if (!name) { document.getElementById('colName').focus(); return; }
  state.columns.push({ id: uid(), name, color: selectedColColor });
  persistState();
  renderBoard();
  closeColumnModal();
  showToast('Coluna criada!', 'success');
}

function deleteColumn(colId) {
  if (!confirm('Excluir esta coluna e todas as suas tarefas?')) return;
  state.columns = state.columns.filter(c => c.id !== colId);
  state.cards = state.cards.filter(c => c.colId !== colId);
  persistState();
  renderBoard();
  showToast('Coluna excluída', 'success');
}

function startRenameCol(colId, el) {
  const col = state.columns.find(c => c.id === colId);
  if (!col) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'col-title-input';
  input.value = col.name;
  el.replaceWith(input);
  input.focus();
  input.select();
  const done = () => {
    const val = input.value.trim() || col.name;
    col.name = val;
    input.replaceWith(el);
    el.textContent = val;
    persistState();
  };
  input.addEventListener('blur', done);
  input.addEventListener('keydown', e => { if(e.key==='Enter') done(); if(e.key==='Escape') { input.value=col.name; done(); } });
}

// ─── CARDS ────────────────────────────────────────────────────────────────────
function openCardModal(colId) {
  editingCard = null;
  editingCardColumn = colId;
  document.getElementById('cardModalTitle').textContent = 'Nova Tarefa';
  document.getElementById('cardModalIcon').textContent = '📝';
  document.getElementById('cardTitle').value = '';
  document.getElementById('cardDesc').value = '';
  document.getElementById('cardPriority').value = 'none';
  document.getElementById('cardDue').value = '';
  document.getElementById('cardTag').value = '';
  selectedTagColor = '#6366F1';
  refreshColorPicker('tagColorPicker', TAG_COLORS, (c) => { selectedTagColor = c; }, '#6366F1');
  document.getElementById('cardOverlay').classList.add('active');
  setTimeout(() => document.getElementById('cardTitle').focus(), 100);
}

function openEditCard(cardId) {
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;
  editingCard = cardId;
  editingCardColumn = card.colId;
  document.getElementById('cardModalTitle').textContent = 'Editar Tarefa';
  document.getElementById('cardModalIcon').textContent = '✏️';
  document.getElementById('cardTitle').value = card.title;
  document.getElementById('cardDesc').value = card.desc || '';
  document.getElementById('cardPriority').value = card.priority || 'none';
  document.getElementById('cardDue').value = card.due || '';
  document.getElementById('cardTag').value = card.tag || '';
  selectedTagColor = card.tagColor || '#6366F1';
  refreshColorPicker('tagColorPicker', TAG_COLORS, (c) => { selectedTagColor = c; }, selectedTagColor);
  document.getElementById('cardOverlay').classList.add('active');
  setTimeout(() => document.getElementById('cardTitle').focus(), 100);
}

function closeCardModal(e) {
  if (!e || e.target === document.getElementById('cardOverlay')) {
    document.getElementById('cardOverlay').classList.remove('active');
    editingCard = null;
  }
}

function saveCard() {
  const title = document.getElementById('cardTitle').value.trim();
  if (!title) { document.getElementById('cardTitle').focus(); return; }

  const data = {
    title,
    desc: document.getElementById('cardDesc').value.trim(),
    priority: document.getElementById('cardPriority').value,
    due: document.getElementById('cardDue').value,
    tag: document.getElementById('cardTag').value.trim(),
    tagColor: selectedTagColor,
    colId: editingCardColumn,
  };

  if (editingCard) {
    const idx = state.cards.findIndex(c => c.id === editingCard);
    if (idx !== -1) state.cards[idx] = { ...state.cards[idx], ...data };
  } else {
    state.cards.push({ id: uid(), ...data, createdAt: Date.now() });
  }

  persistState();
  renderBoard();
  closeCardModal();
  showToast(editingCard ? 'Tarefa atualizada!' : 'Tarefa criada!', 'success');
}

function deleteCard(cardId) {
  if (!confirm('Excluir esta tarefa?')) return;
  state.cards = state.cards.filter(c => c.id !== cardId);
  persistState();
  renderBoard();
  showToast('Tarefa excluída', 'success');
}

// ─── DRAG & DROP ──────────────────────────────────────────────────────────────
function onCardDragStart(e, cardId) {
  dragCard = cardId;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const el = document.querySelector(`[data-card-id="${cardId}"]`);
    if (el) el.classList.add('dragging');
  }, 0);
}

function onCardDragEnd() {
  dragCard = null;
  document.querySelectorAll('.card.dragging').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('.drag-placeholder').forEach(el => el.remove());
  document.querySelectorAll('.column.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function onCardDragOver(e, colId) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const col = document.getElementById(`cards-${colId}`);
  if (!col) return;
  col.closest('.column').classList.add('drag-over');

  // placeholder
  document.querySelectorAll('.drag-placeholder').forEach(el => el.remove());
  const ph = document.createElement('div');
  ph.className = 'drag-placeholder';

  const cards = [...col.querySelectorAll('.card:not(.dragging)')];
  const afterEl = getDragAfterElement(col, e.clientY);
  if (afterEl) col.insertBefore(ph, afterEl);
  else col.appendChild(ph);
}

function onCardDragLeave(e, colId) {
  const col = document.getElementById(`cards-${colId}`);
  if (col && !col.contains(e.relatedTarget)) {
    col.closest('.column').classList.remove('drag-over');
    document.querySelectorAll('.drag-placeholder').forEach(el => el.remove());
  }
}

function onCardDrop(e, colId) {
  e.preventDefault();
  if (!dragCard) return;

  const col = document.getElementById(`cards-${colId}`);
  const ph = col.querySelector('.drag-placeholder');
  const cards = [...col.querySelectorAll('.card:not(.dragging)')];

  let insertBeforeCardId = null;
  if (ph) {
    const next = ph.nextElementSibling;
    if (next && next.dataset.cardId) insertBeforeCardId = next.dataset.cardId;
  }

  // Update colId
  const card = state.cards.find(c => c.id === dragCard);
  if (!card) return;
  card.colId = colId;

  // Reorder
  state.cards = state.cards.filter(c => c.id !== dragCard);
  const colCards = state.cards.filter(c => c.colId === colId);
  const otherCards = state.cards.filter(c => c.colId !== colId);

  if (insertBeforeCardId) {
    const insertIdx = colCards.findIndex(c => c.id === insertBeforeCardId);
    if (insertIdx === -1) colCards.push(card);
    else colCards.splice(insertIdx, 0, card);
  } else {
    colCards.push(card);
  }

  state.cards = [...otherCards, ...colCards];
  persistState();
  renderBoard();
}

function getDragAfterElement(container, y) {
  const els = [...container.querySelectorAll('.card:not(.dragging)')];
  return els.reduce((closest, el) => {
    const box = el.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) return { offset, element: el };
    return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

// ─── COLOR PICKER ─────────────────────────────────────────────────────────────
function buildColorPicker(containerId, colors, onChange, defaultColor) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  colors.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c === defaultColor ? ' active' : '');
    sw.style.background = c;
    sw.onclick = () => {
      el.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      onChange(c);
    };
    el.appendChild(sw);
  });
}

function refreshColorPicker(containerId, colors, onChange, activeColor) {
  const el = document.getElementById(containerId);
  el.querySelectorAll('.color-swatch').forEach(sw => {
    sw.classList.toggle('active', sw.style.background === hexToRgb(activeColor) || sw.style.background === activeColor);
    sw.onclick = () => {
      el.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      onChange(sw.style.background);
    };
  });
  onChange(activeColor);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function priorityLabel(p) { return {low:'Baixa',medium:'Média',high:'Alta'}[p]||p; }
function formatDue(d) {
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function showToast(msg, type='success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span>${type==='success'?'✓':'⚠'}</span> ${msg}`;
  c.appendChild(t);
  setTimeout(() => {
    t.classList.add('removing');
    setTimeout(() => t.remove(), 300);
  }, 2800);
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCardModal(); closeColumnModal(); }
  if (e.key === 'Enter' && document.getElementById('cardOverlay').classList.contains('active')) {
    if (document.activeElement.tagName !== 'TEXTAREA') saveCard();
  }
  if (e.key === 'Enter' && document.getElementById('colOverlay').classList.contains('active')) {
    saveColumn();
  }
});

// ─── START ────────────────────────────────────────────────────────────────────
init();
</script>
